name: Auto Update Satellite Imagery & Deploy to Pages

on:
  schedule:
    # Run hourly at minute 40 (after NOAA finishes the hourly mosaic around minute 35)
    - cron: '40 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-satellite-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install s3fs xarray netCDF4 numpy

      - name: Run GMGSI Extraction Pipeline
        run: |
          python pipeline/extract_gmgsi.py

      - name: Commit and push updated frames
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NOAA GMGSI satellite frames" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage website files
        run: |
          mkdir -p _site
          cp -r index.html css js wasm data .nojekyll _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
