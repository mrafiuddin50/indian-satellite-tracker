name: Auto Update Satellite Imagery & Deploy to Pages

on:
  schedule:
    # Run twice an hour at minute 15 and 45 (NOAA mosaic ready around minute 35)
    # Running at :45 catches new images promptly, :15 catches any NOAA or Actions lag
    - cron: '15,45 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-satellite-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install s3fs xarray netCDF4 h5netcdf scipy numpy

      - name: Run GMGSI Extraction Pipeline
        run: |
          python pipeline/extract_gmgsi.py

      - name: Commit and push updated frames
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NOAA GMGSI satellite frames [skip ci]" && git pull --rebase origin main && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage website files
        run: |
          mkdir -p _site
          cp -r index.html css js wasm data .nojekyll _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
