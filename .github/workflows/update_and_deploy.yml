name: Auto Update Satellite Imagery & Deploy to Pages

# How freshness is achieved
# -------------------------
# NOAA publishes GMGSI hour HH on S3 at about HH:39 UTC. GitHub's `schedule`
# trigger is best-effort and on this repo fired only every 4-8 hours, which is
# why the site lagged. So each run now:
#   1. restores the frames already live on the site (no frames in git),
#   2. waits until NOAA publishes the next hour, extracts it and deploys,
#   3. re-dispatches itself, so a new run is always waiting for the next hour.
# The cron entries below are only a safety net that restarts the chain if it
# ever breaks. Set the repository variable SELF_CHAIN=false to switch the chain
# off (e.g. if you trigger runs from an external scheduler instead).

on:
  schedule:
    - cron: '41 * * * *'
    - cron: '11 * * * *'
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: 'Minutes to wait for the next NOAA frame (0 = deploy now)'
        required: false
        default: '75'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: satellite-pipeline
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore live frames, wait for NOAA, extract
        id: extract
        env:
          RESTORE_FROM: ${{ steps.pages.outputs.base_url }}
          BUILD_SHA: ${{ github.sha }}
          WAIT_MINUTES: ${{ github.event_name == 'push' && '0' || github.event.inputs.wait_minutes || '75' }}
        run: python pipeline/extract_gmgsi.py

      - name: Stage website files
        if: steps.extract.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r index.html css js wasm data .nojekyll _site/
          ls _site/data/frames | wc -l

      - name: Upload Pages artifact
        if: steps.extract.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.extract.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Queue the next run (self-chaining)
        if: success() && vars.SELF_CHAIN != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Guard against a tight loop: if nothing changed and we barely waited,
          # leave it to the cron safety net instead of re-dispatching at once.
          elapsed=$(( $(date +%s) - JOB_START ))
          echo "Run elapsed: ${elapsed}s, changed=${{ steps.extract.outputs.changed }}"
          if [ "${{ steps.extract.outputs.changed }}" != "true" ] && [ "$elapsed" -lt 600 ]; then
            echo "Short run with no new data: not chaining."
            exit 0
          fi
          gh workflow run update_and_deploy.yml --repo ${{ github.repository }} --ref main
          echo "Next run queued."
